services:
  sensor-timeline:
    build: .
    image: sensor-timeline:latest
    container_name: sensor-timeline
    ports:
      - "8000:8000"
    environment:
      SENSOR_DB_PATH: /data/sensors.db
      SENSOR_HOST: 0.0.0.0
      SENSOR_PORT: 8000
      SENSOR_LOG_LEVEL: info
    volumes:
      - sensor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sensor-data:
